  <script>
    let currentCity = 'hk';
    
    const endpoints = {
      hk_routine: _B + 'JSON/data/hk_weather.json',
      zs_routine: _B + 'JSON/data/zs_weather.json',
      hk_special: _B + 'JSON/data/hk_special_weather.json',
      zs_special: _B + 'JSON/data/zs_special_weather.json'
    };

    function formatHKTime(timeInput, forceDate = false) {
      if (!timeInput) return '';
      let d = new Date(timeInput);
      if (isNaN(d.getTime())) {
        if (typeof timeInput === 'string' && timeInput.match(/^\d{1,2}:\d{2}(:\d{2})?$/)) {
          const todayISO = new Date().toISOString().split('T')[0];
          d = new Date(`${todayISO}T${timeInput}`);
        }
        if (isNaN(d.getTime())) return timeInput;
      }
      try {
        const hkDateFormatter = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Hong_Kong', year: 'numeric', month: '2-digit', day: '2-digit' });
        const targetHKDate = hkDateFormatter.format(d);
        const currentHKDate = hkDateFormatter.format(new Date());
        const timeStr = new Intl.DateTimeFormat('zh-HK', { timeZone: 'Asia/Hong_Kong', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(d);
        const mdStr = new Intl.DateTimeFormat('zh-HK', { timeZone: 'Asia/Hong_Kong', month: 'numeric', day: 'numeric' }).format(d);

        return (forceDate || targetHKDate !== currentHKDate) ? `${mdStr} ${timeStr}` : `${mdStr} ${timeStr}`;
      } catch (err) {
        return timeInput;
      }
    }

    function switchCity(city) {
      currentCity = city;
      const btnHk = document.getElementById('tab-hk');
      const btnZs = document.getElementById('tab-zs');
      const badge = document.getElementById('city-badge');

      if (city === 'hk') {
        btnHk.className = 'flex-1 py-3 px-4 rounded-xl font-extrabold text-lg flex items-center justify-center gap-2 transition-all duration-200 bg-white text-sky-700 shadow-md';
        btnZs.className = 'flex-1 py-3 px-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition-all duration-200 text-slate-600 hover:text-slate-900';
        badge.innerText = '🇭🇰 香港地區';
        badge.className = 'bg-sky-100 text-sky-800 font-bold px-2.5 py-0.5 rounded-md';
      } else {
        btnZs.className = 'flex-1 py-3 px-4 rounded-xl font-extrabold text-lg flex items-center justify-center gap-2 transition-all duration-200 bg-white text-emerald-700 shadow-md';
        btnHk.className = 'flex-1 py-3 px-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition-all duration-200 text-slate-600 hover:text-slate-900';
        badge.innerText = '🇨🇳 中山地區';
        badge.className = 'bg-emerald-100 text-emerald-800 font-bold px-2.5 py-0.5 rounded-md';
      }
      fetchWeather(city);
    }

    async function fetchWeather(city) {
      const contentEl = document.getElementById('weather-content');
      const timeEl = document.getElementById('update-time');
      
      contentEl.innerHTML = `
        <div class="text-center py-8 text-slate-400 space-y-3">
          <i class="fa-solid fa-circle-notch fa-spin text-3xl text-sky-500"></i>
          <p class="text-base font-medium">更新緊 ${city === 'hk' ? '香港' : '中山'} 最新氣候數據...</p>
        </div>
      `;

      const timestamp = '?t=' + new Date().getTime();
      const routineUrl = endpoints[city + '_routine'] + timestamp;
      const specialUrl = endpoints[city + '_special'] + timestamp;

      let routineMsg = null;
      let specialMsg = null;
      let dataTimestamp = null;

      try {
        const routineRes = await fetch(routineUrl);
        if (routineRes.ok) {
          const routineData = await routineRes.json();
          if (routineData) {
            const key = city === 'hk' ? 'hk_message' : 'zs_message';
            routineMsg = routineData[key] || routineData.message || null;
            dataTimestamp = routineData.updated_at || routineData.time;
          }
        }
      } catch (err) {}

      try {
        const specialRes = await fetch(specialUrl);
        if (specialRes.ok) {
          const specialData = await specialRes.json();
          if (specialData) {
            const key = city === 'hk' ? 'hk_message' : 'zs_message';
            specialMsg = specialData[key] || specialData.message || null;
            if (!dataTimestamp) dataTimestamp = specialData.updated_at || specialData.time;
          }
        }
      } catch (err) {}

      let htmlBuilder = '';
      const isHk = city === 'hk';

      if (routineMsg && typeof routineMsg === 'string' && routineMsg.trim() !== '') {
        let formattedRoutine = routineMsg.replace(/\\n/g, '<br>').replace(/\n/g, '<br>').trim();
        const boxBg = isHk ? 'bg-sky-50/80 border-sky-100' : 'bg-emerald-50/80 border-emerald-100';
        htmlBuilder += `
          <div class="${boxBg} p-5 rounded-2xl border text-slate-800 shadow-inner leading-loose text-lg md:text-xl font-medium">
            ${formattedRoutine}
          </div>
        `;
      }

      if (specialMsg && typeof specialMsg === 'string' && specialMsg.trim() !== '') {
        let boxBgColor = '#dc2626';
        let textColor = '#ffffff';  
        let headerColor = 'text-yellow-300'; 
        let isAlertPulse = 'alert-pulse';

        if (specialMsg.includes('警報解除')) {
          boxBgColor = '#10b981'; textColor = '#ffffff'; headerColor = 'text-white'; isAlertPulse = '';
        } else if (isHk) {
          if (specialMsg.includes('一號')) { boxBgColor = '#fca5a5'; } 
          else if (specialMsg.includes('三號')) { boxBgColor = '#f97316'; } 
          else if (specialMsg.includes('八號')) { boxBgColor = '#b91c1c'; } 
          else if (specialMsg.includes('九號') || specialMsg.includes('十號')) { boxBgColor = '#450a0a'; } 
          else if (specialMsg.includes('黃色')) { boxBgColor = '#d97706'; } 
          else if (specialMsg.includes('黑色')) { boxBgColor = '#09090b'; }
        } else {
          if (specialMsg.includes('白')) { boxBgColor = '#ffffff'; textColor = '#1e293b'; headerColor = 'text-amber-600'; } 
          else if (specialMsg.includes('藍') || specialMsg.includes('蓝')) { boxBgColor = '#2563eb'; } 
          else if (specialMsg.includes('黃') || specialMsg.includes('黄')) { boxBgColor = '#eab308'; textColor = '#1e293b'; headerColor = 'text-amber-900'; } 
          else if (specialMsg.includes('橙')) { boxBgColor = '#f97316'; } 
          else if (specialMsg.includes('紅') || specialMsg.includes('红')) { boxBgColor = '#dc2626'; }
        }

        let rawMsg = specialMsg.replace(/\\n/g, '\n').replace(/\*/g, '').trim(); 

        let timeMatch = rawMsg.match(/⏰?\s*(.*時間[^\n]+)/);
        if (timeMatch) {
            rawMsg = rawMsg.replace(timeMatch[0], '').trim();
        }

        if (rawMsg.includes('警報解除')) {
            let titleMatch = rawMsg.match(/([✅\s]*【.*?】|[✅\s]*[^\n]+警報解除)/);
            let alertTitle = titleMatch ? titleMatch[1].replace(/[【】]/g, '').trim() : (isHk ? '✅ 香港警報解除' : '✅ 中山警報解除');
            let alertBody = titleMatch ? rawMsg.replace(titleMatch[0], '').replace(/[！!]+$/g, '').trim() : rawMsg.replace(/[！!]+$/g, '').trim();

            htmlBuilder += `
              <div style="background-color: ${boxBgColor}; color: ${textColor};" class="p-6 md:p-8 rounded-3xl shadow-lg border border-white/40 flex flex-col items-center text-center mt-2 transition-colors duration-500 relative overflow-hidden w-full box-border h-full">
                <div class="absolute top-0 left-0 right-0 h-1/2 bg-gradient-to-b from-white/20 to-transparent pointer-events-none"></div>
                <div class="font-black text-lg sm:text-xl md:text-2xl ${headerColor} mb-4 drop-shadow-md tracking-tight w-full leading-snug whitespace-nowrap">
                  ${alertTitle}
                </div>
                <div class="text-base md:text-lg font-bold opacity-95 tracking-wide break-words whitespace-normal mt-2">
                  ${alertBody}
                </div>
              </div>
            `;
        } 
        else if (rawMsg.includes('提早收工戒備')) {
            let titleMatch = rawMsg.match(/([🚨🌪️\s]*【.*?】|[🚨🌪️\s]*提早收工戒備[：:]?[^\n]*)/);
            let alertTitle = titleMatch ? titleMatch[1].replace(/[【】]/g, '').trim() : '🚨 提早收工戒備';
            let remain = titleMatch ? rawMsg.replace(titleMatch[0], '').trim() : rawMsg;
            
            let formattedTitle = alertTitle;
            if (formattedTitle.includes('：')) {
                let parts = formattedTitle.split('：');
                formattedTitle = `${parts[0]}：<br><span class="inline-block whitespace-nowrap">${parts[1]}</span>`;
            } else if (formattedTitle.includes(':')) {
                let parts = formattedTitle.split(':');
                formattedTitle = `${parts[0]}：<br><span class="inline-block whitespace-nowrap">${parts[1]}</span>`;
            }

            let alertFooter = '';
            let footerMatch = remain.match(/[\n！!]*\s*(💡\s*請各位.*|請注意.*)$/is);
            if (footerMatch) {
                let cleanFooterText = footerMatch[1].replace(/💡\s*/, '').replace(/[！!]+$/g, '').trim();
                alertFooter = `<div class="mt-4 text-base sm:text-lg opacity-90 font-medium tracking-wide w-full break-words whitespace-normal"><i class="fa-solid fa-circle-info"></i> <span>${cleanFooterText}</span></div>`;
                remain = remain.replace(footerMatch[0], '').trim();
            }

            let alertBody = remain.replace(/[「」]/g, '').replace(/\n+/g, '<br>');

            htmlBuilder += `
              <div style="background-color: ${boxBgColor}; color: ${textColor};" class="p-6 md:p-8 rounded-3xl shadow-xl border border-white/40 ${isAlertPulse} flex flex-col items-center text-center mt-2 transition-colors duration-500 relative overflow-hidden w-full box-border h-full">
                <div class="absolute top-0 left-0 right-0 h-1/2 bg-gradient-to-b from-white/20 to-transparent pointer-events-none"></div>
                <div class="font-black text-lg sm:text-xl md:text-2xl ${headerColor} mb-4 drop-shadow-md tracking-tight w-full leading-snug whitespace-nowrap">
                  ${formattedTitle}
                </div>
                <div class="text-sm md:text-base font-medium leading-loose bg-white/15 px-5 py-5 rounded-2xl backdrop-blur-md w-full border border-white/30 border-l-4 border-l-yellow-300 shadow-sm text-left break-words whitespace-normal box-border">
                  ${alertBody}
                </div>
                ${alertFooter}
              </div>
            `;
        }
        else {
            let titleMatch = rawMsg.match(/([🚨\s]*【.*?】|[🚨\s]*[^\n]+戒備|[🚨\s]*[^\n]+預警)/);
            let alertTitle = titleMatch ? titleMatch[1].replace(/[【】]/g, '').trim() : (isHk ? '🚨 香港極端天氣預警' : '🚨 中山極端天氣預警');
            let remain = titleMatch ? rawMsg.replace(titleMatch[0], '').trim() : rawMsg;

            let alertFooter = '';
            let footerMatch = remain.match(/[\n！!]*\s*(請注意.*)$/is);
            if (footerMatch) {
                let cleanFooterText = footerMatch[1].replace(/[！!\s]+$/g, '').trim();
                alertFooter = `<div class="mt-4 text-base sm:text-lg opacity-90 font-medium tracking-wide w-full break-words whitespace-normal">${cleanFooterText}</div>`;
                remain = remain.replace(footerMatch[0], '').trim();
            }

            let highlightColor = textColor === '#ffffff' ? 'text-white' : 'text-slate-900';

            let cleanRemain = remain
              .replace(/(天文台|中山市氣象局)(現正發出|啱啱掛咗|現正生效[：:]?)\s*/g, '')
              .trim();

            let capsules = [];
            let lines = cleanRemain.split(/\n+/);
            lines.forEach(line => {
                let lineMatch = line.match(/(🌀|🟡|🔴|⚫|⚠️)\s*([^\n]+)/);
                if (lineMatch) {
                    let emoji = lineMatch[1];
                    let text = lineMatch[2];
                    let parts = text.split('、'); 
                    parts.forEach(p => {
                        let cleanText = p.trim().replace(/[！!]+$/, '');
                        if (cleanText) {
                            let titlePart = cleanText;
                            let timePart = '';
                            
                            let timeInParen = cleanText.match(/(.*?)（(.*?)）/);
                            if (timeInParen) {
                                titlePart = timeInParen[1].trim();
                                timePart = timeInParen[2].trim();
                            }

                            if (titlePart.includes('或') && !titlePart.includes('<br>')) {
                                titlePart = titlePart.replace('或', '<br>或');
                            }

                            let innerHtml = `<span>${emoji} ${titlePart}</span>`;
                            if (timePart) {
                                innerHtml += `<span class="text-xs font-normal opacity-90 mt-1">${timePart}</span>`;
                            }

                            let bgSpan = boxBgColor === '#ffffff' ? 'bg-white border-slate-200' : 'bg-white/25 border-white/30';
                            capsules.push(`<span class="inline-flex flex-col items-center justify-center ${bgSpan} px-4 py-2 rounded-xl shadow-sm border font-black text-lg md:text-xl ${highlightColor} drop-shadow-md text-center leading-snug w-full">${innerHtml}</span>`);
                        }
                    });
                }
            });

            // 🎯 核心修改：徹底移除「天文台現正生效：」等前綴，只保留簡潔膠囊容器
            let capsulesContainerHtml = capsules.length > 0 
                ? `<div class="flex flex-col items-center justify-center gap-2 mt-1 w-full box-border">${capsules.join('')}</div>`
                : '';

            htmlBuilder += `
              <div style="background-color: ${boxBgColor}; color: ${textColor};" class="p-6 md:p-8 rounded-3xl shadow-xl border border-white/40 ${isAlertPulse} flex flex-col items-center text-center mt-2 transition-colors duration-500 relative overflow-hidden w-full box-border h-full">
                <div class="absolute top-0 left-0 right-0 h-1/2 bg-gradient-to-b from-white/20 to-transparent pointer-events-none"></div>
                <div class="font-black text-lg sm:text-xl md:text-2xl ${headerColor} mb-4 drop-shadow-md tracking-tight w-full leading-snug whitespace-nowrap">
                  ${alertTitle}
                </div>
                
                <div class="w-full flex flex-col items-center justify-center box-border">
                  ${capsulesContainerHtml}
                </div>
                ${alertFooter}
              </div>
            `;
        }
      }

      if (htmlBuilder !== '') {
        contentEl.innerHTML = htmlBuilder;
        const showTime = dataTimestamp ? formatHKTime(dataTimestamp, true) : formatHKTime(new Date(), true);
        timeEl.innerText = '最後更新：' + showTime;
      } else {
        contentEl.innerHTML = `
          <div class="text-center py-8 text-slate-500 font-medium text-lg space-y-2">
            <p>🔄 數據更新中，請稍候...</p>
          </div>
        `;
        timeEl.innerText = '暫無最新更新';
      }
    }

    function openShareModal() {
      const currentUrl = window.location.href;
      document.getElementById('qr-code-img').src = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(currentUrl);
      document.getElementById('share-modal').classList.remove('hidden');
    }
    function closeShareModal() { document.getElementById('share-modal').classList.add('hidden'); }
    function copyShareLink() {
      const shareUrl = window.location.href;
      navigator.clipboard.writeText(shareUrl).then(() => {
        const textEl = document.getElementById('copy-text');
        textEl.innerText = '✅ 已成功複製連結！';
        setTimeout(() => { textEl.innerText = '複製網頁連結'; }, 2000);
      });
    }
    function openPwaModal() { document.getElementById('pwa-modal').classList.remove('hidden'); }
    function closePwaModal() { document.getElementById('pwa-modal').classList.add('hidden'); }
    function openModal() { document.getElementById('info-modal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('info-modal').classList.add('hidden'); }

    document.getElementById('share-modal').addEventListener('click', function(e) { if (e.target === this) closeShareModal(); });
    document.getElementById('pwa-modal').addEventListener('click', function(e) { if (e.target === this) closePwaModal(); });
    document.getElementById('info-modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

    fetchWeather('hk');
  </script>
</body>
</html>
