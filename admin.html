<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌤️ 雙城天氣系統 - 審計日誌 (Audit Logs)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;600;700;900&display=swap');
        body { font-family: 'Noto Sans HK', -apple-system, sans-serif; }
        /* 強制列印/PDF 保留背景色與漸變色 */
        @media print {
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
        .alert-pulse { animation: alertPulse 1.5s infinite; }
        @keyframes alertPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.01); opacity: 0.98; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-4 md:p-6 min-h-screen">

    <div class="max-w-2xl mx-auto">
        <!-- 頂部控制台 -->
        <div class="flex justify-between items-center mb-6 bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
            <h1 class="text-xl md:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-600 to-indigo-600 tracking-tight flex items-center gap-2">
                <span>🌤️</span> 審計日誌
            </h1>
            <button onclick="fetchData()" class="bg-sky-50 text-sky-700 border border-sky-200 hover:bg-sky-100 px-4 py-2 rounded-xl font-bold shadow-sm transition-all flex items-center gap-2 text-sm md:text-base active:scale-95">
                <i class="fa-solid fa-rotate-right"></i> 實時刷新
            </button>
        </div>

        <!-- Filter 過濾器 -->
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 mb-6 flex flex-col md:flex-row gap-6">
            <div>
                <span class="text-sm font-bold text-slate-400 block mb-2">地區 (Region)</span>
                <div class="flex gap-2">
                    <button onclick="setFilter('region', 'ALL')" class="filter-btn-region px-4 py-1.5 rounded-xl text-sm font-bold bg-slate-100 text-slate-600 border border-transparent transition-all" data-val="ALL">全部</button>
                    <button onclick="setFilter('region', 'HK')" class="filter-btn-region px-4 py-1.5 rounded-xl text-sm font-bold bg-slate-100 text-slate-600 border border-transparent transition-all" data-val="HK">香港 (HK)</button>
                    <button onclick="setFilter('region', 'ZS')" class="filter-btn-region px-4 py-1.5 rounded-xl text-sm font-bold bg-slate-100 text-slate-600 border border-transparent transition-all" data-val="ZS">中山 (ZS)</button>
                </div>
            </div>
            <div>
                <span class="text-sm font-bold text-slate-400 block mb-2">類別 (Type)</span>
                <div class="flex gap-2">
                    <button onclick="setFilter('type', 'ALL')" class="filter-btn-type px-4 py-1.5 rounded-xl text-sm font-bold bg-slate-100 text-slate-600 border border-transparent transition-all" data-val="ALL">全部</button>
                    <button onclick="setFilter('type', '日常')" class="filter-btn-type px-4 py-1.5 rounded-xl text-sm font-bold bg-slate-100 text-slate-600 border border-transparent transition-all" data-val="日常">日常推播</button>
                    <button onclick="setFilter('type', '哨兵')" class="filter-btn-type px-4 py-1.5 rounded-xl text-sm font-bold bg-slate-100 text-slate-600 border border-transparent transition-all" data-val="哨兵">哨兵警報</button>
                </div>
            </div>
        </div>

        <!-- 卡片流 (Feed Container) -->
        <div id="feed-container" class="space-y-6">
            <div class="text-center py-10 text-slate-400 space-y-3 bg-white rounded-3xl border border-gray-100">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-sky-500"></i>
                <p class="text-base font-medium">載入數據中...</p>
            </div>
        </div>
    </div>

    <script>
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let allData = [];
        let currentFilter = { region: 'ALL', type: 'ALL' };

        // 格式化時間： 25/7 23:16:23
        function formatHKTime(isoString) {
            const d = new Date(isoString);
            return `${d.getDate()}/${d.getMonth() + 1} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
        }

        function detectType(message) {
            if (!message || message.trim() === "") return '隱藏'; 
            if (message.startsWith('HK *') || message.startsWith('CN *') || message.includes('🇭🇰') || message.includes('🇨🇳')) {
                return '日常';
            }
            return '哨兵';
        }

        async function fetchData() {
            const container = document.getElementById('feed-container');
            container.innerHTML = `
                <div class="text-center py-10 text-slate-400 space-y-3 bg-white rounded-3xl border border-gray-100 shadow-sm">
                    <i class="fa-solid fa-circle-notch fa-spin text-3xl text-sky-500"></i>
                    <p class="text-base font-medium">同步緊數據庫...</p>
                </div>
            `;

            const { data, error } = await supabaseClient
                .from('weather_audit_log')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                container.innerHTML = `<div class="text-center text-red-500 py-10 bg-white rounded-3xl font-bold shadow-sm">讀取失敗，請檢查 config.js 及連線。</div>`;
                return;
            }

            allData = data.map(row => ({
                ...row,
                computedType: detectType(row.message)
            }));

            // 預設 active 狀態
            updateFilterUI('region');
            updateFilterUI('type');
            renderFeed();
        }

        function setFilter(category, value) {
            currentFilter[category] = value;
            updateFilterUI(category);
            renderFeed();
        }

        function updateFilterUI(category) {
            document.querySelectorAll(`.filter-btn-${category}`).forEach(btn => {
                if (btn.getAttribute('data-val') === currentFilter[category]) {
                    btn.className = `filter-btn-${category} px-4 py-1.5 rounded-xl text-sm font-bold bg-indigo-100 text-indigo-700 border border-indigo-200 transition-all shadow-sm`;
                } else {
                    btn.className = `filter-btn-${category} px-4 py-1.5 rounded-xl text-sm font-bold bg-slate-100 text-slate-600 border border-transparent hover:bg-slate-200 transition-all`;
                }
            });
        }

        function renderFeed() {
            const container = document.getElementById('feed-container');
            container.innerHTML = '';

            const filteredData = allData.filter(row => {
                if (row.computedType === '隱藏') return false; // 排除空字串
                const matchRegion = currentFilter.region === 'ALL' || row.region === currentFilter.region;
                const matchType = currentFilter.type === 'ALL' || row.computedType === currentFilter.type;
                return matchRegion && matchType;
            });

            if (filteredData.length === 0) {
                container.innerHTML = '<div class="text-center text-slate-400 py-10 bg-white rounded-3xl border border-gray-100 shadow-sm font-bold">冇符合條件嘅記錄。</div>';
                return;
            }

            filteredData.forEach(row => {
                const isHk = row.region === 'HK';
                let msg = row.message;

                // 📌 卡片標頭 (對齊 Frontend)
                let regionBadge = isHk 
                    ? `<span class="bg-sky-100 text-sky-800 font-bold px-2.5 py-0.5 rounded-md">🇭🇰 香港地區</span>`
                    : `<span class="bg-emerald-100 text-emerald-800 font-bold px-2.5 py-0.5 rounded-md">🇨🇳 中山地區</span>`;
                
                let headerHTML = `
                    <div class="flex items-center justify-between text-xs md:text-sm text-slate-500 border-b border-slate-100 pb-3 mb-4">
                        <span class="flex items-center gap-1.5 font-bold text-sky-700">
                            <span class="text-slate-300 font-normal">#${row.id}</span>
                            <i class="fa-solid fa-clock"></i> <span>最後更新：${formatHKTime(row.created_at)}</span>
                        </span>
                        ${regionBadge}
                    </div>
                `;

                let contentHTML = "";

                if (row.computedType === '日常') {
                    // ==========================================
                    // 🌤️ 日常天氣 (嚴格區分顏色)
                    // ==========================================
                    let formattedRoutine = msg.replace(/^(HK|CN)\s*\*\s*/, '').replace(/\*(.*?)\*/g, '<span class="font-bold text-slate-900">$1</span>').replace(/\n/g, '<br>').trim();
                    const boxBg = isHk ? 'bg-sky-50/80 border-sky-100' : 'bg-emerald-50/80 border-emerald-100';
                    
                    contentHTML = `
                        <div class="${boxBg} p-5 rounded-2xl border text-slate-800 shadow-inner leading-loose text-base font-medium">
                            ${formattedRoutine}
                        </div>
                    `;
                } else {
                    // ==========================================
                    // 🚨 哨兵警報 (四層立體結構 + 動態顏色引擎)
                    // ==========================================
                    let boxBgColor = '#dc2626'; // 預設紅色
                    let textColor = '#ffffff';  
                    let headerColor = 'text-yellow-300'; 
                    let isAlertPulse = 'alert-pulse'; 

                    // 🎨 判定底色
                    if (msg.includes('警報解除')) {
                        boxBgColor = '#10b981'; textColor = '#ffffff'; headerColor = 'text-white'; isAlertPulse = ''; 
                    } else if (isHk) {
                        if (msg.includes('一號')) { boxBgColor = '#fca5a5'; } 
                        else if (msg.includes('三號')) { boxBgColor = '#f97316'; } 
                        else if (msg.includes('八號')) { boxBgColor = '#b91c1c'; } 
                        else if (msg.includes('九號') || msg.includes('十號')) { boxBgColor = '#450a0a'; } 
                        else if (msg.includes('黃色')) { boxBgColor = '#d97706'; } 
                        else if (msg.includes('黑色')) { boxBgColor = '#09090b'; }
                    } else {
                        if (msg.includes('白')) { boxBgColor = '#ffffff'; textColor = '#1e293b'; headerColor = 'text-amber-600'; } 
                        else if (msg.includes('藍') || msg.includes('蓝')) { boxBgColor = '#2563eb'; } 
                        else if (msg.includes('黃') || msg.includes('黄')) { boxBgColor = '#eab308'; textColor = '#1e293b'; headerColor = 'text-amber-900'; } 
                        else if (msg.includes('橙')) { boxBgColor = '#f97316'; } 
                        else if (msg.includes('紅') || msg.includes('红')) { boxBgColor = '#dc2626'; }
                    }

                    let rawMsg = msg.replace(/\*/g, '').trim(); 
                    let timeInfo = '';

                    // ⏱️ 層次 1：抽離時間膠囊
                    let timeMatch = rawMsg.match(/⏰?\s*(.*時間[^\n]+)/);
                    if (timeMatch) {
                        timeInfo = `<div class="text-xs md:text-sm font-bold bg-white/25 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full mb-4 backdrop-blur-md shadow-sm border border-white/30 text-inherit w-fit max-w-full break-words whitespace-normal text-center">
                                      <i class="fa-solid fa-bullhorn"></i> ${timeMatch[1].trim()}
                                    </div>`;
                        rawMsg = rawMsg.replace(timeMatch[0], '').trim();
                    }

                    if (rawMsg.includes('警報解除')) {
                        // 🟢 安全解除 Layout
                        let titleMatch = rawMsg.match(/([✅\s]*【.*?】)/);
                        let alertTitle = titleMatch ? titleMatch[1].trim() : `✅ 【${isHk ? '香港' : '中山'}警報解除】`;
                        let alertBody = titleMatch ? rawMsg.replace(titleMatch[0], '').trim() : rawMsg;

                        contentHTML = `
                            <div style="background-color: ${boxBgColor}; color: ${textColor};" class="p-6 md:p-8 rounded-3xl shadow-lg border border-white/40 flex flex-col items-center text-center transition-colors relative overflow-hidden w-full box-border">
                                <div class="absolute top-0 left-0 right-0 h-1/2 bg-gradient-to-b from-white/20 to-transparent pointer-events-none"></div>
                                ${timeInfo}
                                <div class="font-black text-xl md:text-2xl ${headerColor} mb-2 drop-shadow-md tracking-tight w-full leading-snug whitespace-nowrap">${alertTitle}</div>
                                <div class="text-base md:text-lg font-bold opacity-95 tracking-wide break-words whitespace-normal mt-2">${alertBody}</div>
                            </div>`;
                    } 
                    else if (rawMsg.includes('提早收工戒備')) {
                        // 🟡 長文通告 Layout (防爆積木 + 官方引言線)
                        let titleMatch = rawMsg.match(/([🚨🌪️\s]*【.*?】)/);
                        let alertTitle = titleMatch ? titleMatch[1].trim() : '🚨 突發極端天氣警報';
                        let remain = titleMatch ? rawMsg.replace(titleMatch[0], '').trim() : rawMsg;
                        
                        let formattedTitle = alertTitle;
                        if (formattedTitle.includes('：')) {
                            let parts = formattedTitle.split('：');
                            formattedTitle = `${parts[0]}：<br><span class="inline-block whitespace-nowrap">${parts[1]}</span>`;
                        }

                        let alertFooter = '';
                        let footerMatch = remain.match(/[\n！!]*\s*(💡\s*請各位.*|請注意.*)$/is);
                        if (footerMatch) {
                            let cleanFooterText = footerMatch[1].replace(/💡\s*/, '').trim();
                            alertFooter = `<div class="mt-5 text-sm sm:text-base font-bold opacity-90 tracking-wide w-full break-words whitespace-normal text-center flex items-center justify-center gap-1.5">
                                              <i class="fa-solid fa-circle-info"></i> <span>${cleanFooterText}</span>
                                           </div>`;
                            remain = remain.replace(footerMatch[0], '').trim();
                        }
                        let alertBody = remain.replace(/\n+/g, '<br>');

                        contentHTML = `
                            <div style="background-color: ${boxBgColor}; color: ${textColor};" class="p-5 md:p-7 rounded-3xl shadow-xl border border-white/40 ${isAlertPulse} flex flex-col items-center transition-colors relative overflow-hidden w-full box-border">
                                <div class="absolute top-0 left-0 right-0 h-1/2 bg-gradient-to-b from-white/20 to-transparent pointer-events-none"></div>
                                ${timeInfo}
                                <div class="font-black text-xl md:text-2xl ${headerColor} mb-5 drop-shadow-md tracking-tight w-full leading-snug text-center px-2">${formattedTitle}</div>
                                <div class="text-sm md:text-base font-medium leading-loose bg-white/15 px-5 py-5 rounded-2xl backdrop-blur-md w-full border border-white/30 border-l-4 border-l-yellow-300 shadow-sm text-left break-words whitespace-normal box-border">
                                    ${alertBody}
                                </div>
                                ${alertFooter}
                            </div>`;
                    }
                    else {
                        // 🔴 條件四：常規膠囊 Layout (終極霸氣極限版)
                        let titleMatch = rawMsg.match(/([🚨\s]*【.*?】)/);
                        let alertTitle = titleMatch ? titleMatch[1].trim() : '🚨 突發極端天氣警報';
                        let remain = titleMatch ? rawMsg.replace(titleMatch[0], '').trim() : rawMsg;

                        let alertFooter = '';
                        let footerMatch = remain.match(/[\n！!]*\s*(請注意.*)$/is);
                        if (footerMatch) {
                            alertFooter = `<div class="mt-4 text-sm sm:text-base md:text-lg opacity-90 font-medium tracking-wide w-full break-words whitespace-normal">${footerMatch[1].replace(/^[！!\s]+|[！!\s]+$/g, '')}</div>`;
                            remain = remain.replace(footerMatch[0], '').trim();
                        }

                        let highlightColor = textColor === '#ffffff' ? 'text-white' : 'text-slate-900';
                        
                        // Regex 膠囊切割：字體回升 (text-[15.5px])，無 hidden，確保 12 字單行霸氣顯示
                        let alertBody = remain.replace(/(🌀|🟡|🔴|⚫|⚠️)\s*([^\n]+)/g, (m, emoji, text) => {
                            let parts = text.split('、'); 
                            let capsules = parts.map(p => {
                                let cleanText = p.trim().replace(/[！!]+$/, '');
                                // ⬆️ 將 text-[13px] 提升至 text-[15.5px] (或者寫 text-base)，並微調 px-3 py-2 令比例更完美
                                return `<span class="inline-flex items-center gap-1.5 bg-white/25 px-3 sm:px-4 py-2 rounded-xl shadow-sm border border-white/30 font-black text-[15.5px] sm:text-lg md:text-xl ${highlightColor} drop-shadow-md whitespace-nowrap shrink-0 max-w-full">${emoji} ${cleanText}</span>`;
                            });
                            return `<div class="flex flex-wrap justify-center gap-1.5 sm:gap-2 mt-3 mb-1 w-full box-border">${capsules.join('')}</div>`;
                        });
                        alertBody = alertBody.replace(/\n+/g, '<br>').replace(/^<br>|<br>$/g, '');

                        contentHTML = `
                            <div style="background-color: ${boxBgColor}; color: ${textColor};" class="p-5 sm:p-6 md:p-8 rounded-3xl shadow-xl border border-white/40 ${isAlertPulse} flex flex-col items-center text-center mt-5 transition-colors duration-500 relative overflow-hidden w-full box-border">
                                <div class="absolute top-0 left-0 right-0 h-1/2 bg-gradient-to-b from-white/20 to-transparent pointer-events-none"></div>
                                ${timeInfo}
                                <!-- 🛡️ 鎖死單行，霸氣不換行 -->
                                <div class="font-black text-lg sm:text-xl md:text-2xl ${headerColor} mb-4 drop-shadow-md tracking-tight w-full leading-snug whitespace-nowrap">
                                  ${alertTitle}
                                </div>
                                <!-- 🛡️ 榨乾橫向空間，內框 Padding 極限 px-2 -->
                                <div class="text-base sm:text-lg md:text-xl font-bold leading-relaxed bg-black/10 px-2 sm:px-5 py-4 rounded-2xl backdrop-blur-sm w-full border border-black/5 shadow-inner flex flex-col items-center justify-center box-border">
                                  ${alertBody}
                                </div>
                                ${alertFooter}
                            </div>
                        `;
                    }
                }

                let card = document.createElement('div');
                card.className = "bg-white/90 backdrop-blur-xl p-5 md:p-6 rounded-3xl shadow-sm border border-white/80 relative overflow-hidden";
                card.innerHTML = `
                    <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-sky-400 via-amber-400 to-rose-400"></div>
                    ${headerHTML}
                    ${contentHTML}
                `;
                container.appendChild(card);
            });
        }

        window.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>
</html>
