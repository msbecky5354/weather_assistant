<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌤️ 雙城天氣系統 - 審計日誌 (Audit Logs)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;600;700;900&display=swap');
        body { font-family: 'Noto Sans HK', -apple-system, sans-serif; }
        .font-noto-hk { font-family: 'Noto Sans HK', -apple-system, BlinkMacSystemFont, sans-serif !important; }
        @media print {
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
        .alert-pulse { animation: alertPulse 1.5s infinite; }
        @keyframes alertPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.01); opacity: 0.98; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-4 md:p-6 min-h-screen font-noto-hk">

    <div class="max-w-3xl mx-auto">
        <!-- 頂部控制台 -->
        <div class="flex justify-between items-center mb-6 bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
            <h1 class="text-xl md:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-600 to-indigo-600 tracking-tight flex items-center gap-2">
                <span>🌤️</span> 審計日誌
            </h1>
            <button onclick="fetchData()" class="bg-sky-50 text-sky-700 border border-sky-200 hover:bg-sky-100 px-4 py-2 rounded-xl font-bold shadow-sm transition-all flex items-center gap-2 text-sm md:text-base active:scale-95">
                <i class="fa-solid fa-rotate-right"></i> 實時刷新
            </button>
        </div>

        <!-- Filter 過濾器 -->
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 mb-4 flex flex-col md:flex-row gap-6">
            <div>
                <span class="text-sm font-bold text-slate-400 block mb-2">地區 (Region)</span>
                <div class="flex gap-2">
                    <button onclick="setFilter('region', 'ALL')" class="filter-btn-region px-4 py-1.5 rounded-xl text-sm font-bold bg-slate-100 text-slate-600 border border-transparent transition-all" data-val="ALL">全部</button>
                    <button onclick="setFilter('region', 'HK')" class="filter-btn-region px-4 py-1.5 rounded-xl text-sm font-bold bg-slate-100 text-slate-600 border border-transparent transition-all" data-val="HK">香港 (HK)</button>
                    <button onclick="setFilter('region', 'ZS')" class="filter-btn-region px-4 py-1.5 rounded-xl text-sm font-bold bg-slate-100 text-slate-600 border border-transparent transition-all" data-val="ZS">中山 (ZS)</button>
                </div>
            </div>
            <div>
                <span class="text-sm font-bold text-slate-400 block mb-2">類別 (Type)</span>
                <div class="flex gap-2">
                    <button onclick="setFilter('type', 'ALL')" class="filter-btn-type px-4 py-1.5 rounded-xl text-sm font-bold bg-slate-100 text-slate-600 border border-transparent transition-all" data-val="ALL">全部</button>
                    <button onclick="setFilter('type', '日常')" class="filter-btn-type px-4 py-1.5 rounded-xl text-sm font-bold bg-slate-100 text-slate-600 border border-transparent transition-all" data-val="日常">日常推播</button>
                    <button onclick="setFilter('type', '哨兵')" class="filter-btn-type px-4 py-1.5 rounded-xl text-sm font-bold bg-slate-100 text-slate-600 border border-transparent transition-all" data-val="哨兵">哨兵警報</button>
                </div>
            </div>
        </div>

        <!-- 🔀 視圖切換 (View Switcher Tabs) -->
        <div class="flex rounded-2xl bg-slate-200/80 p-1.5 gap-1.5 shadow-inner mb-6">
            <button id="view-tab-box" onclick="setViewMode('box')" class="flex-1 py-2.5 px-4 rounded-xl font-extrabold text-sm md:text-base flex items-center justify-center gap-2 transition-all duration-200 bg-white text-indigo-700 shadow-md">
                <i class="fa-solid fa-layer-group"></i> 視覺卡片 (Layout Box)
            </button>
            <button id="view-tab-table" onclick="setViewMode('table')" class="flex-1 py-2.5 px-4 rounded-xl font-bold text-sm md:text-base flex items-center justify-center gap-2 transition-all duration-200 text-slate-600 hover:text-slate-900">
                <i class="fa-solid fa-table-list"></i> 數據表格 (Data Table)
            </button>
        </div>

        <!-- Feed / Table Container -->
        <div id="feed-container" class="space-y-6">
            <div class="text-center py-10 text-slate-400 space-y-3 bg-white rounded-3xl border border-gray-100">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-sky-500"></i>
                <p class="text-base font-medium">載入數據中...</p>
            </div>
        </div>
    </div>

    <script>
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let allData = [];
        let currentFilter = { region: 'ALL', type: 'ALL' };
        let currentViewMode = 'box';

        function formatHKTime(isoString) {
            const d = new Date(isoString);
            return `${d.getDate()}/${d.getMonth() + 1} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
        }

        function detectType(message) {
            if (!message || message.trim() === "") return '隱藏'; 
            if (message.startsWith('HK *') || message.startsWith('CN *') || message.includes('🇭🇰') || message.includes('🇨🇳')) {
                return '日常';
            }
            return '哨兵';
        }

        async function fetchData() {
            const container = document.getElementById('feed-container');
            container.innerHTML = `
                <div class="text-center py-10 text-slate-400 space-y-3 bg-white rounded-3xl border border-gray-100 shadow-sm font-noto-hk">
                    <i class="fa-solid fa-circle-notch fa-spin text-3xl text-sky-500"></i>
                    <p class="text-base font-medium">同步緊數據庫...</p>
                </div>
            `;

            const { data, error } = await supabaseClient
                .from('weather_audit_log')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                container.innerHTML = `<div class="text-center text-red-500 py-10 bg-white rounded-3xl font-bold shadow-sm font-noto-hk">讀取失敗，請檢查 config.js 及連線。</div>`;
                return;
            }

            allData = data.map(row => ({
                ...row,
                computedType: detectType(row.message)
            }));

            updateFilterUI('region');
            updateFilterUI('type');
            updateViewTabUI();
            renderFeed();
        }

        function setFilter(category, value) {
            currentFilter[category] = value;
            updateFilterUI(category);
            renderFeed();
        }

        function setViewMode(mode) {
            currentViewMode = mode;
            updateViewTabUI();
            renderFeed();
        }

        function updateFilterUI(category) {
            document.querySelectorAll(`.filter-btn-${category}`).forEach(btn => {
                if (btn.getAttribute('data-val') === currentFilter[category]) {
                    btn.className = `filter-btn-${category} px-4 py-1.5 rounded-xl text-sm font-bold bg-indigo-100 text-indigo-700 border border-indigo-200 transition-all shadow-sm font-noto-hk`;
                } else {
                    btn.className = `filter-btn-${category} px-4 py-1.5 rounded-xl text-sm font-bold bg-slate-100 text-slate-600 border border-transparent hover:bg-slate-200 transition-all font-noto-hk`;
                }
            });
        }

        function updateViewTabUI() {
            const btnBox = document.getElementById('view-tab-box');
            const btnTable = document.getElementById('view-tab-table');

            if (currentViewMode === 'box') {
                btnBox.className = 'flex-1 py-2.5 px-4 rounded-xl font-extrabold text-sm md:text-base flex items-center justify-center gap-2 transition-all duration-200 bg-white text-indigo-700 shadow-md font-noto-hk';
                btnTable.className = 'flex-1 py-2.5 px-4 rounded-xl font-bold text-sm md:text-base flex items-center justify-center gap-2 transition-all duration-200 text-slate-600 hover:text-slate-900 font-noto-hk';
            } else {
                btnTable.className = 'flex-1 py-2.5 px-4 rounded-xl font-extrabold text-sm md:text-base flex items-center justify-center gap-2 transition-all duration-200 bg-white text-indigo-700 shadow-md font-noto-hk';
                btnBox.className = 'flex-1 py-2.5 px-4 rounded-xl font-bold text-sm md:text-base flex items-center justify-center gap-2 transition-all duration-200 text-slate-600 hover:text-slate-900 font-noto-hk';
            }
        }

        function renderFeed() {
            const container = document.getElementById('feed-container');
            container.innerHTML = '';

            const filteredData = allData.filter(row => {
                if (row.computedType === '隱藏') return false;
                const matchRegion = currentFilter.region === 'ALL' || row.region === currentFilter.region;
                const matchType = currentFilter.type === 'ALL' || row.computedType === currentFilter.type;
                return matchRegion && matchType;
            });

            if (filteredData.length === 0) {
                container.innerHTML = '<div class="text-center text-slate-400 py-10 bg-white rounded-3xl border border-gray-100 shadow-sm font-bold font-noto-hk">冇符合條件嘅記錄。</div>';
                return;
            }

            if (currentViewMode === 'table') {
                let tableWrapper = document.createElement('div');
                tableWrapper.className = "bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden p-2 md:p-4 font-noto-hk";

                let rowsHTML = filteredData.map(row => {
                    const isHk = row.region === 'HK';
                    const regionBadge = isHk 
                        ? `<span class="bg-sky-100 text-sky-800 font-bold px-2 py-0.5 rounded text-xs whitespace-nowrap">🇭🇰 香港</span>`
                        : `<span class="bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded text-xs whitespace-nowrap">🇨🇳 中山</span>`;
                    
                    const typeBadge = row.computedType === '日常'
                        ? `<span class="bg-slate-100 text-slate-700 font-bold px-2 py-0.5 rounded text-xs whitespace-nowrap">日常</span>`
                        : `<span class="bg-rose-100 text-rose-700 font-bold px-2 py-0.5 rounded text-xs whitespace-nowrap">哨兵</span>`;

                    let cleanPreview = row.message
                        .replace(/\*/g, '')
                        .replace(/[【】]/g, '')
                        .replace(/[「」]/g, '')
                        .replace(/[！!]+$/g, '')
                        .replace(/^(HK|CN)\s*\*\s*/, '')
                        .replace(/\n+/g, ' ')
                        .trim();

                    return `
                        <tr class="border-b border-slate-100 hover:bg-slate-50/80 transition-colors">
                            <td class="py-3 px-3 font-mono font-bold text-xs text-slate-400">#${row.id}</td>
                            <td class="py-3 px-3 font-medium text-xs text-slate-600 whitespace-nowrap">${formatHKTime(row.created_at)}</td>
                            <td class="py-3 px-3">${regionBadge}</td>
                            <td class="py-3 px-3">${typeBadge}</td>
                            <td class="py-3 px-3 text-xs md:text-sm font-medium text-slate-800 leading-relaxed max-w-md break-words">${cleanPreview}</td>
                        </tr>
                    `;
                }).join('');

                tableWrapper.innerHTML = `
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-slate-200 bg-slate-50/50 text-slate-400 text-xs font-bold uppercase tracking-wider">
                                    <th class="py-3 px-3">ID</th>
                                    <th class="py-3 px-3">更新時間</th>
                                    <th class="py-3 px-3">地區</th>
                                    <th class="py-3 px-3">類別</th>
                                    <th class="py-3 px-3">訊息內容預覽 (Audit Preview)</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rowsHTML}
                            </tbody>
                        </table>
                    </div>
                `;
                container.appendChild(tableWrapper);
                return;
            }

            filteredData.forEach(row => {
                const isHk = row.region === 'HK';
                let msg = row.message;

                let regionBadge = isHk 
                    ? `<span class="bg-sky-100 text-sky-800 font-bold px-2.5 py-0.5 rounded-md">🇭🇰 香港地區</span>`
                    : `<span class="bg-emerald-100 text-emerald-800 font-bold px-2.5 py-0.5 rounded-md">🇨🇳 中山地區</span>`;
                
                let headerHTML = `
                    <div class="flex items-center justify-between text-xs md:text-sm text-slate-500 border-b border-slate-100 pb-3 mb-4 font-noto-hk">
                        <span class="flex items-center gap-1.5 font-bold text-sky-700">
                            <span class="text-slate-300 font-normal">#${row.id}</span>
                            <i class="fa-solid fa-clock"></i> <span>最後更新：${formatHKTime(row.created_at)}</span>
                        </span>
                        ${regionBadge}
                    </div>
                `;

                let contentHTML = "";

                if (row.computedType === '日常') {
                    let formattedRoutine = msg.replace(/^(HK|CN)\s*\*\s*/, '').replace(/\*(.*?)\*/g, '<span class="font-bold text-slate-900">$1</span>').replace(/\n/g, '<br>').trim();
                    const boxBg = isHk ? 'bg-sky-50/80 border-sky-100' : 'bg-emerald-50/80 border-emerald-100';
                    
                    contentHTML = `
                        <div class="${boxBg} p-5 md:p-6 rounded-3xl border text-slate-800 shadow-inner leading-relaxed text-base md:text-lg font-medium font-noto-hk">
                            ${formattedRoutine}
                        </div>
                    `;
                } else {
                    let boxBgColor = '#dc2626'; 
                    let textColor = '#ffffff';  
                    let headerColor = 'text-yellow-300'; 
                    let isAlertPulse = 'alert-pulse'; 

                    if (msg.includes('警報解除')) {
                        boxBgColor = '#10b981'; textColor = '#ffffff'; headerColor = 'text-white'; isAlertPulse = ''; 
                    } else if (isHk) {
                        if (msg.includes('一號')) { boxBgColor = '#fca5a5'; } 
                        else if (msg.includes('三號')) { boxBgColor = '#f97316'; } 
                        else if (msg.includes('八號')) { boxBgColor = '#b91c1c'; } 
                        else if (msg.includes('九號') || msg.includes('十號')) { boxBgColor = '#450a0a'; } 
                        else if (msg.includes('黃色')) { boxBgColor = '#d97706'; } 
                        else if (msg.includes('黑色')) { boxBgColor = '#09090b'; }
                    } else {
                        if (msg.includes('白')) { boxBgColor = '#ffffff'; textColor = '#1e293b'; headerColor = 'text-amber-600'; } 
                        else if (msg.includes('藍') || msg.includes('蓝')) { boxBgColor = '#2563eb'; } 
                        else if (msg.includes('黃') || msg.includes('黄')) { boxBgColor = '#eab308'; textColor = '#1e293b'; headerColor = 'text-amber-900'; } 
                        else if (msg.includes('橙')) { boxBgColor = '#f97316'; } 
                        else if (msg.includes('紅') || msg.includes('红')) { boxBgColor = '#dc2626'; }
                    }

                    let rawMsg = msg.replace(/\*/g, '').trim(); 

                    let timeMatch = rawMsg.match(/⏰?\s*(.*時間[^\n]+)/);
                    if (timeMatch) {
                        rawMsg = rawMsg.replace(timeMatch[0], '').trim();
                    }

                    if (rawMsg.includes('警報解除')) {
                        let titleMatch = rawMsg.match(/([✅\s]*【.*?】|[✅\s]*[^\n]+警報解除)/);
                        let alertTitle = titleMatch ? titleMatch[1].replace(/[【】]/g, '').trim() : `✅ ${isHk ? '香港' : '中山'}警報解除`;
                        let alertBody = titleMatch ? rawMsg.replace(titleMatch[0], '').replace(/[！!]+$/g, '').trim() : rawMsg.replace(/[！!]+$/g, '').trim();

                        contentHTML = `
                            <div style="background-color: ${boxBgColor}; color: ${textColor};" class="p-5 md:p-6 rounded-3xl shadow-lg border border-white/40 flex flex-col items-center text-center transition-colors relative overflow-hidden w-full box-border font-noto-hk">
                                <div class="absolute top-0 left-0 right-0 h-1/2 bg-gradient-to-b from-white/20 to-transparent pointer-events-none"></div>
                                <div class="font-black text-lg md:text-xl ${headerColor} mb-3 drop-shadow-md tracking-tight w-full leading-snug whitespace-nowrap">${alertTitle}</div>
                                <div class="text-base md:text-lg font-bold opacity-95 tracking-wide break-words whitespace-normal mt-1">${alertBody}</div>
                            </div>`;
                    } 
                    else if (rawMsg.includes('提早收工戒備')) {
                        let titleMatch = rawMsg.match(/([🚨🌪️\s]*【.*?】|[🚨🌪️\s]*提早收工戒備[：:]?[^\n]*)/);
                        let alertTitle = titleMatch ? titleMatch[1].replace(/[【】]/g, '').trim() : '🚨 提早收工戒備';
                        let remain = titleMatch ? rawMsg.replace(titleMatch[0], '').trim() : rawMsg;
                        
                        let formattedTitle = alertTitle;
                        if (formattedTitle.includes('：')) {
                            let parts = formattedTitle.split('：');
                            formattedTitle = `${parts[0]}：<br><span class="inline-block whitespace-nowrap">${parts[1]}</span>`;
                        } else if (formattedTitle.includes(':')) {
                            let parts = formattedTitle.split(':');
                            formattedTitle = `${parts[0]}：<br><span class="inline-block whitespace-nowrap">${parts[1]}</span>`;
                        }

                        let alertFooter = '';
                        let footerMatch = remain.match(/[\n！!]*\s*(💡\s*請各位.*|請注意.*)$/is);
                        if (footerMatch) {
                            let cleanFooterText = footerMatch[1].replace(/💡\s*/, '').replace(/[！!]+$/g, '').trim();
                            alertFooter = `<div class="mt-3 text-sm md:text-base font-semibold opacity-95 tracking-wide w-full break-words whitespace-normal text-center flex items-center justify-center gap-1.5 font-noto-hk">
                                              <i class="fa-solid fa-circle-info"></i> <span>${cleanFooterText}</span>
                                           </div>`;
                            remain = remain.replace(footerMatch[0], '').trim();
                        }
                        let alertBody = remain.replace(/[「」]/g, '').replace(/\n+/g, '<br>');

                        contentHTML = `
                            <div style="background-color: ${boxBgColor}; color: ${textColor};" class="p-5 md:p-6 rounded-3xl shadow-xl border border-white/40 ${isAlertPulse} flex flex-col items-center transition-colors relative overflow-hidden w-full box-border font-noto-hk">
                                <div class="absolute top-0 left-0 right-0 h-1/2 bg-gradient-to-b from-white/20 to-transparent pointer-events-none"></div>
                                <div class="font-black text-lg md:text-xl ${headerColor} mb-3 drop-shadow-md tracking-tight w-full leading-snug text-center px-2">${formattedTitle}</div>
                                <div class="text-sm md:text-base font-medium leading-relaxed bg-white/15 px-4 py-4 rounded-2xl backdrop-blur-md w-full border border-white/30 border-l-4 border-l-yellow-300 shadow-sm text-left break-words whitespace-normal box-border">
                                    ${alertBody}
                                </div>
                                ${alertFooter}
                            </div>`;
                    }
                    else {
                        let titleMatch = rawMsg.match(/([🚨\s]*【.*?】|[🚨\s]*[^\n]+戒備|[🚨\s]*[^\n]+預警)/);
                        let alertTitle = titleMatch ? titleMatch[1].replace(/[【】]/g, '').trim() : (isHk ? '🚨 香港極端天氣預警' : '🚨 中山極端天氣預警');
                        let remain = titleMatch ? rawMsg.replace(titleMatch[0], '').trim() : rawMsg;

                        let alertFooter = '';
                        let footerMatch = remain.match(/[\n！!]*\s*(請注意.*)$/is);
                        if (footerMatch) {
                            let cleanFooterText = footerMatch[1].replace(/[！!\s]+$/g, '').trim();
                            alertFooter = `<div class="mt-3 text-sm md:text-base font-semibold opacity-95 tracking-wide w-full break-words whitespace-normal font-noto-hk text-center">${cleanFooterText}</div>`;
                            remain = remain.replace(footerMatch[0], '').trim();
                        }

                        let highlightColor = textColor === '#ffffff' ? 'text-white' : 'text-slate-900';

                        let cleanRemain = remain
                          .replace(/(天文台|中山市氣象局)(現正發出|啱啱掛咗|現正生效[：:]?)\s*/g, '')
                          .trim();

                        let capsules = [];
                        let lines = cleanRemain.split(/\n+/);
                        lines.forEach(line => {
                            let lineMatch = line.match(/(🌀|🟡|🔴|⚫|⚠️)\s*([^\n]+)/);
                            if (lineMatch) {
                                let emoji = lineMatch[1];
                                let text = lineMatch[2];
                                let parts = text.split('、'); 
                                parts.forEach(p => {
                                    let cleanText = p.trim().replace(/[！!]+$/, '');
                                    if (cleanText) {
                                        let titlePart = cleanText;
                                        let timePart = '';
                                        
                                        let timeInParen = cleanText.match(/(.*?)（(.*?)）/);
                                        if (timeInParen) {
                                            titlePart = timeInParen[1].trim();
                                            timePart = timeInParen[2].trim();
                                        }

                                        if (titlePart.includes('或') && !titlePart.includes('<br>')) {
                                            titlePart = titlePart.replace('或', '<br>或');
                                        }

                                        let innerHtml = `<span>${emoji} ${titlePart}</span>`;
                                        if (timePart) {
                                            innerHtml += `<span class="text-xs font-normal opacity-90 mt-0.5">${timePart}</span>`;
                                        }

                                        let bgSpan = boxBgColor === '#ffffff' ? 'bg-white border-slate-200' : 'bg-white/25 border-white/30';
                                        capsules.push(`<span class="inline-flex flex-col items-center justify-center ${bgSpan} px-4 py-2 rounded-xl shadow-sm border font-bold text-base md:text-lg ${highlightColor} drop-shadow-md text-center leading-snug w-full font-noto-hk">${innerHtml}</span>`);
                                    }
                                });
                            }
                        });

                        let capsulesContainerHtml = capsules.length > 0 
                            ? `<div class="flex flex-col items-center justify-center gap-2 mt-1 w-full box-border">${capsules.join('')}</div>`
                            : '';

                        contentHTML = `
                            <div style="background-color: ${boxBgColor}; color: ${textColor};" class="p-5 md:p-6 rounded-3xl shadow-xl border border-white/40 ${isAlertPulse} flex flex-col items-center text-center transition-colors relative overflow-hidden w-full box-border font-noto-hk">
                                <div class="absolute top-0 left-0 right-0 h-1/2 bg-gradient-to-b from-white/20 to-transparent pointer-events-none"></div>
                                <div class="font-black text-lg md:text-xl ${headerColor} mb-3 drop-shadow-md tracking-tight w-full leading-snug whitespace-nowrap">
                                  ${alertTitle}
                                </div>
                                <div class="w-full flex flex-col items-center justify-center box-border">
                                  ${capsulesContainerHtml}
                                </div>
                                ${alertFooter}
                            </div>
                        `;
                    }
                }

                let card = document.createElement('div');
                card.className = "bg-white/90 backdrop-blur-xl p-5 md:p-6 rounded-3xl shadow-sm border border-white/80 relative overflow-hidden max-w-md mx-auto w-full font-noto-hk";
                card.innerHTML = `
                    <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-sky-400 via-amber-400 to-rose-400"></div>
                    ${headerHTML}
                    ${contentHTML}
                `;
                container.appendChild(card);
